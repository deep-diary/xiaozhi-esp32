  espressif/esp_lcd_axs15231b: ^1.0.0

  espressif/esp_lcd_st7701:
    version: ^1.1.4
    rules:
    - if: target in [esp32s3, esp32p4]
  espressif/esp_lcd_st7796:
    version: 1.3.5
    rules:
    - if: target in [esp32, esp32s2, esp32s3, esp32p4]
  espressif/esp_lcd_spd2010: ==1.0.2
  espressif/esp_io_expander_tca9554: ~2.0.3
  waveshare/custom_io_expander_ch32v003: ^1.0.0
  espressif/esp_lcd_panel_io_additions: ^1.0.1
  78/esp_lcd_nv3023: ~1.0.0
  78/esp-wifi-connect:
    path: ../components/esp-wifi-connect
  espressif/esp_audio_effects: ~1.3.0
  espressif/esp_audio_codec: ~2.5.0
  78/esp-ml307: ~3.6.5
  78/uart-eth-modem:
    version: ~0.4.2
    rules:
    - if: target not in [esp32]
  78/xiaozhi-fonts: ~1.6.0
  espressif/led_strip: ~3.0.2
  espressif/esp_codec_dev: ~1.5.6
  espressif/esp-sr: ~2.4.6
  espressif/button: ~4.2.0
  espressif/knob: ^1.0.0
  esphome/esp-hub75:
    version: ^0.3.5
    rules:
    - if: target in [esp32p4, esp32s3]
  espressif/esp32-camera:
    version: ^2.1.6
    rules:
    - if: target in [esp32s3]
  espressif/esp_video:
    version: ==1.3.1   # for compatibility. update version may need to modify this project code.
    rules:
    - if: target in [esp32p4, esp32s3]

  espressif/esp_image_effects:
    version: ^1.0.1
    rules:
    - if: target not in [esp32]
  espressif/esp_lcd_touch_ft5x06: ~1
  espressif/esp_lcd_touch_gt911: ^1
  espressif/esp_lcd_touch_gt1151: ^1
  waveshare/esp_lcd_touch_cst9217: ^1.0.3
  espressif/esp_lcd_touch_cst816s: ^1
  lvgl/lvgl: ~9.5.0
  esp_lvgl_port: ~2.8.0
  espressif/esp_io_expander_tca95xx_16bit: ^2.0.0
  espressif2022/image_player: ^1.1.1
  espressif2022/esp_emote_expression: ^0.1.0
  espressif/esp_mmap_assets: ^1.3.2
  txp666/otto-emoji-gif-component:
    version: ^1.1.1
    rules:
    - if: target in [esp32s3]
  espressif/adc_battery_estimation: ^0.2.1
  espressif/esp_new_jpeg: ^0.6.1

  # deep-dog RTSP H.264 soft encode (ESP32-S3)
  espressif/esp_h264:
    version: ^1.1.1
    rules:
    - if: target in [esp32s3]

  # SenseCAP Watcher Board
  wvirgil123/sscma_client:
    version: 1.0.2
    rules:
    - if: target in [esp32s3]

  tny-robotics/sh1106-esp-idf: ^1.0.0
  espressif/esp_lcd_jd9365:
    version: '*'
    rules:
    - if: target in [esp32p4]
  waveshare/esp_lcd_hx8394:
    version: '*'
    rules:
    - if: target in [esp32p4]
  waveshare/esp_lcd_st7703:
    version: '*'
    rules:
    - if: target in [esp32p4]
  espressif/esp32_p4_function_ev_board:
    version: ^5.0.3
    rules:
    - if: target in [esp32p4]
  espressif/esp_lcd_ili9881c:
    version: ^1.0.1
    rules:
    - if: target in [esp32p4]
  espressif/esp_lcd_ek79007:
    version: ^1.0.3
    rules:
    - if: target in [esp32p4]
  espressif/esp_hosted:
    version: 2.0.17
    rules:
    - if: target in [esp32h2, esp32p4]
  espressif/esp_wifi_remote:
    version: '*'
    rules:
    - if: target in [esp32p4]
  espfriends/servo_dog_ctrl:
    version: ^0.1.8
    rules:
    - if: target in [esp32c3]

  llgok/cpp_bus_driver:
    version: 1.1.0
    rules:
    - if: target in [esp32p4]

  espressif/bmi270_sensor:
    version: ^0.1.0
    rules:
    - if: target in [esp32s3, esp32c5]

  # ESP-DL: 与 esp-sr ~2.4.6（需 esp-dsp 1.8）对齐，需 esp-dl 3.3.x
  espressif/esp-dl:
    version: ~3.3.0
    rules:
    - if: target in [esp32s3]

  # 人脸检测：0.5.x 依赖 esp-dl ~3.3.0（0.3/0.4 仍锁 ~3.2，会与 esp-sr 2.4.6 冲突）
  espressif/human_face_detect:
    version: ~0.5.0
    rules:
    - if: target in [esp32s3]

  # 人脸特征 / 本地识别（S04）：vendored 自 esp-dl（Registry 0.3.2 仍锁 detect 0.4）
  espressif/human_face_recognition:
    path: ../components/human_face_recognition
    rules:
    - if: target in [esp32s3]

  espressif/touch_slider_sensor:
    version: ^0.2.0~1
    rules:
    - if: target in [esp32s3]

  espressif/touch_button_sensor:
    version: ^0.2.2~1
    rules:
    - if: target in [esp32s3]

  espressif/esp_lcd_touch_st7123: ^1.0.0
  espressif/iot_usbh_rndis:
    version: ^0.3.1
    rules:
    - if: target in [esp32s3, esp32p4]

  espressif/bq27220:
    public: true
    version: '*'

  ## Required IDF version
  idf:
    version: '>=5.5.2'
  m5stack/m5ioe1: ^1.0.8
  m5stack/m5pm1: ^1.0.5
  micro-ros/micro_ros_espidf_component: '>=22.0.0,<23.0.0'
